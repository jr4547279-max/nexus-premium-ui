<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#020409"><title>Nexus Earth</title><style>
:root{color-scheme:dark;--cyan:#68eaff;--glass:rgba(5,13,24,.55);--line:rgba(145,219,255,.17)}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#f5fbff;font-family:Inter,system-ui,-apple-system,sans-serif}#stage,canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}#stage{background:radial-gradient(circle at 50% 43%,#071422 0,#010308 48%,#000 100%)}header{position:fixed;z-index:5;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:max(18px,env(safe-area-inset-top)) 18px 0;pointer-events:none}.brand{display:flex;gap:10px;align-items:center}.dot{width:8px;height:8px;border-radius:50%;background:var(--cyan);box-shadow:0 0 18px var(--cyan)}strong{font-size:13px;letter-spacing:.22em}.sub{font-size:8px;letter-spacing:.18em;color:#adc8d899;margin-top:4px;text-transform:uppercase}.live,.panel{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(20px) saturate(1.25);-webkit-backdrop-filter:blur(20px) saturate(1.25);box-shadow:0 18px 60px #0008}.live{padding:8px 10px;border-radius:999px;font-size:9px;letter-spacing:.14em;color:#cae5f7aa}.panel{position:fixed;z-index:5;border-radius:17px}.info{left:16px;bottom:max(16px,env(safe-area-inset-bottom));padding:12px 13px;min-width:155px}.eyebrow{font-size:7px;letter-spacing:.2em;color:#a7c7da77;text-transform:uppercase}.place{font-size:13px;font-weight:700;margin-top:4px}.coords{font-size:9px;color:#cce4f088;margin-top:4px;font-variant-numeric:tabular-nums}.controls{right:16px;bottom:max(16px,env(safe-area-inset-bottom));display:flex;gap:4px;padding:6px}button{border:0;border-radius:11px;background:transparent;color:#d9edf9;font:700 9px system-ui;letter-spacing:.08em;padding:9px 10px}button.active{background:#63ddff1c;color:#8feeff;box-shadow:inset 0 0 0 1px #69dcff22}.hint{position:fixed;z-index:4;left:50%;bottom:27px;transform:translateX(-50%);font-size:8px;letter-spacing:.16em;color:#d4ebfa55;text </style></head><body><div id="stage"></div><div class="fade"></div><header><div class="brand"><span class="dot"></span><div><strong>NEXUS EARTH</strong><div class="sub">Planetary context engine</div></div></div><div class="live">● LIVE GLOBE</div></header><section class="panel info"><div class="eyebrow">View target</div><div class="place" id="place">Planet Earth</div><div class="coords" id="coords">51.5074° N · 0.1278° W</div></section><nav class="panel controls"><button id="earth">EARTH</button><button id="uk">UK</button><button id="orbit" class="active">ORBIT</button></nav><div class="hint">Drag to rotate · pinch or scroll to zoom</div><div id="loader"><div class="loader"><div class="orb"></div>NEXUS EARTH</div></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script><script>
(()=>{const T=window.THREE;if(!T)return;const renderer=new T.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));renderer.outputEncoding=T.sRGBEncoding;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.08;renderer.setClearColor(0x000104);document.getElementById('stage').appendChild(renderer.domElement);const scene=new T.Scene();const camera=new T.PerspectiveCamera(38,innerWidth/innerHeight,.01,1000);camera.position.set(0,.12,4.05);const controls=new T.OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=.055;controls.enablePan=false;controls.minDistance=1.34;controls.maxDistance=7;controls.rotateSpeed=.42;controls.zoomSpeed=.62;controls.autoRotate=true;controls.autoRotateSpeed=.2;
function stars(n,a,b,size,op){const g=new T.BufferGeometry(),p=new Float32Array(n*3);for(let i=0;i<n;i++){const r=a+Math.random()*(b-a),u=Math.random()*2-1,q=Math.random()*Math.PI*2,s=Math.sqrt(1-u*u);p[i*3]=r*s*Math.cos(q);p[i*3+1]=r*u;p[i*3+2]=r*s*Math.sin(q)}g.setAttribute('position',new T.BufferAttribute(p,3));return new T.Points(g,new T.PointsMaterial({color:0xd8eaff,size,transparent:true,opacity:op,depthWrite:false}))}scene.add(stars(2600,30,85,.05,.68),stars(900,14,35,.022,.42));
const globe=new T.Group();globe.rotation.z=T.MathUtils.degToRad(-23.44);scene.add(globe);const loader=new T.TextureLoader();loader.setCrossOrigin('anonymous');const day=loader.load('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg');const night=loader.load('https://unpkg.com/three-globe/example/img/earth-night.jpg');const spec=loader.load('https://threejs.org/examples/textures/planets/earth_specular_2048.jpg');day.encoding=night.encoding=T.sRGBEncoding;day.anisotropy=night.anisotropy=renderer.capabilities.getMaxAnisotropy();const mat=new T.ShaderMaterial({uniforms:{d:{value:day},n:{value:night},s:{value:spec},sun:{value:new T.Vector3(4,1.1,3.5).normalize()}},vertexShader:'varying vec2 u;varying vec3 N,V;void main(){u=uv;vec4 w=modelMatrix*vec4(position,1.);N=normalize(mat3(modelMatrix)*normal);V=normalize(cameraPosition-w.xyz);gl_Position=projectionMatrix*viewMatrix*w;}',fragmentShader:'uniform sampler2D d,n,s;uniform vec3 sun;varying vec2 u;varying vec3 N,V;void main(){vec3 nn=normalize(N);float l=dot(nn,sun);float f=smoothstep(-.16,.22,l);vec3 a=texture2D(d,u).rgb*(.45+.72*max(l,0.));vec3 b=texture2D(n,u).rgb*1.36;float ocean=texture2D(s,u).r;vec3 h=normalize(sun+normalize(V));float gl=pow(max(dot(nn,h),0.),100.)*ocean*max(l,0.);float rim=pow(1.-max(dot(nn,normalize(V)),0.),3.);vec3 c=mix(b,a,f)+vec3(.24,.5,.75)*gl*.75+vec3(.08,.3,.65)*rim*.42;gl_FragColor=vec4(c,1.);}' });globe.add(new T.Mesh(new T.SphereGeometry(1,128,128),mat));
const cc=document.createElement('canvas');cc.width=1024;cc.height=512;const x=cc.getContext('2d');for(let i=0;i<950;i++){const px=Math.random()*1024,py=Math.random()*512,r=8+Math.random()*48,o=.015+Math.random()*.055,g=x.createRadialGradient(px,py,0,px,py,r);g.addColorStop(0,`rgba(255,255,255,${o})`);g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.fillRect(px-r,py-r,r*2,r*2)}const ct=new T.CanvasTexture(cc);ct.wrapS=T.RepeatWrapping;const clouds=new T.Mesh(new T.SphereGeometry(1.009,96,96),new T.MeshPhongMaterial({map:ct,transparent:true,opacity:.48,depthWrite:false,blending:T.AdditiveBlending,color:0xdcefff}));globe.add(clouds);
function atm(r,col,pow,op){return new T.Mesh(new T.SphereGeometry(r,96,96),new T.ShaderMaterial({transparent:true,side:T.BackSide,depthWrite:false,blending:T.AdditiveBlending,uniforms:{c:{value:new T.Color(col)},p:{value:pow},o:{value:op}},vertexShader:'varying vec3 N,V;void main(){vec4 w=modelMatrix*vec4(position,1.);N=normalize(mat3(modelMatrix)*normal);V=normalize(cameraPosition-w.xyz);gl_Position=projectionMatrix*viewMatrix*w;}',fragmentShader:'uniform vec3 c;uniform float p,o;varying vec3 N,V;void main(){float a=pow(max(1.03-dot(normalize(N),normalize(V)),0.),p)*o;gl_FragColor=vec4(c,a);}'}))}globe.add(atm(1.047,0x57ccff,2.15,.78),atm(1.09,0x1769ff,3.4,.25));scene.add(new T.DirectionalLight(0xffffff,1.35));
function ll(lat,lon,r=1.014){const p=(90-lat)*Math.PI/180,t=(lon+180)*Math.PI/180;return new T.Vector3(-r*Math.sin(p)*Math.cos(t),r*Math.cos(p),r*Math.sin(p)*Math.sin(t))}const m=new T.Mesh(new T.SphereGeometry(.008,18,18),new T.MeshBasicMaterial({color:0x8df3ff}));m.position.copy(ll(50.768,-.290));globe.add(m);const ring=new T.Mesh(new T.RingGeometry(.013,.018,48),new T.MeshBasicMaterial({color:0x62e7ff,transparent:true,opacity:.5,side:T.DoubleSide,depthWrite:false}));ring.position.copy(m.position).multiplyScalar(1.002);ring.lookAt(0,0,0);ring.rotateY(Math.PI);globe.add(ring);
const place=document.getElementById('place'),coords=document.getElementById('coords'),orbit=document.getElementById('orbit');let spinning=true;function label(n,lat,lon){place.textContent=n;coords.textContent=`${Math.abs(lat).toFixed(4)}° ${lat>=0?'N':'S'} · ${Math.abs(lon).toFixed(4)}° ${lon>=0?'E':'W'}`}function fly(lat,lon,d,n){controls.autoRotate=false;spinning=false;orbit.classList.remove('active');label(n,lat,lon);const target=ll(lat,lon,1).normalize(),q=new T.Quaternion().setFromUnitVectors(target,new T.Vector3(0,0,1)),q0=globe.quaternion.clone(),d0=camera.position.length(),t0=performance.now();function f(t){const k=Math.min(1,(t-t0)/1400),e=1-Math.pow(1-k,3);T.Quaternion.slerp(q0,q,globe.quaternion,e);camera.position.setLength(T.MathUtils.lerp(d0,d,e));if(k<1)requestAnimationFrame(f)}requestAnimationFrame(f)}document.getElementById('uk').onclick=()=>fly(50.768,-.290,1.9,'East Sussex · UK');document.getElementById('earth').onclick=()=>{label('Planet Earth',51.5074,-.1278);camera.position.setLength(4.05);spinning=true;controls.autoRotate=true;orbit.classList.add('active')};orbit.onclick=()=>{spinning=!spinning;controls.autoRotate=spinning;orbit.classList.toggle('active',spinning)};
let last=performance.now();function draw(t){requestAnimationFrame(draw);const dt=Math.min(.04,(t-last)/1000);last=t;controls.update();clouds.rotation.y+=dt*.012;ring.scale.setScalar(1+.15*Math.sin(t*.003));renderer.render(scene,camera)}requestAnimationFrame(draw);setTimeout(()=>{const l=document.getElementById('loader');l.style.opacity='0';l.style.visibility='hidden'},1300);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio||1,2))});document.addEventListener('visibilitychange',()=>controls.autoRotate=!document.hidden&&spinning)})();
</script></body></html>

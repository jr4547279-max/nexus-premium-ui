[build]
  base = "nexus-premium-ui"
  command = "pnpm run build"
  publish = ".next"

[build.environment]
  PNPM_FLAGS = "--no-frozen-lockfile"
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_ANON_KEY,NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SITE_URL"

# Production environment configured in Netlify.
# Public Supabase client variables are intentionally exposed to the browser.

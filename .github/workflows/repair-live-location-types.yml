name: Repair live location member types

on:
  push:
    branches:
      - feature/live-location-window

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/live-location-window

      - name: Repair component
        shell: python
        run: |
          from pathlib import Path
          path = Path('nexus-premium-ui/components/nexus/live-location-window.tsx')
          text = path.read_text()
          text = text.replace("import { Check, Clock3, LocateFixed, MapPin, Navigation, Radio, Shield, Users, X } from 'lucide-react'", "import { Check, Clock3, LocateFixed, MapPin, Radio, Shield } from 'lucide-react'")
          text = text.replace("interface LiveLocationWindowProps {\n  groupId: string\n}", "interface LiveLocationMember {\n  user_id: string\n  display_name?: string | null\n}\n\ninterface LiveLocationWindowProps {\n  groupId: string\n  members?: LiveLocationMember[]\n}", 1)
          text = text.replace("export function LiveLocationWindow({ groupId }: LiveLocationWindowProps) {", "export function LiveLocationWindow({ groupId, members: groupMembers = [] }: LiveLocationWindowProps) {", 1)
          text = text.replace("    members,\n    isSharing,", "    members: presenceMembers,\n    isSharing,", 1)
          text = text.replace("  const memberById = useMemo(() => new Map(members.map((member) => [member.user_id, member])), [members])", "  const members: LiveLocationMember[] = groupMembers.length > 0\n    ? groupMembers\n    : presenceMembers.map((member) => ({ user_id: member.user_id }))\n  const memberById = useMemo(() => new Map(presenceMembers.map((member) => [member.user_id, member])), [presenceMembers])", 1)
          text = text.replace("(member.user_id === location?.user_id ? 'Sharing now' : 'Group member')", "(member.user_id === location?.user_id ? 'Sharing now' : (member.display_name || 'Group member'))", 1)
          path.write_text(text)

          detail = Path('nexus-premium-ui/components/nexus/group-detail.tsx')
          d = detail.read_text()
          d = d.replace('<LiveLocationWindow groupId={groupId} />', '<LiveLocationWindow groupId={groupId} members={realMembers} />', 1)
          detail.write_text(d)

      - name: Build
        run: |
          npm install -g pnpm@10.17.1
          pnpm install --no-frozen-lockfile
          pnpm --filter my-project build

      - name: Commit repair and clean workflows
        if: ${{ success() }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nexus-premium-ui/components/nexus/live-location-window.tsx nexus-premium-ui/components/nexus/group-detail.tsx .github/workflows/repair-live-location-types.yml
          git rm .github/workflows/finalize-live-location.yml .github/workflows/fix-live-location-types.yml .github/workflows/repair-live-location-types.yml
          git commit -m "fix: repair live location member types"
          git push origin HEAD:feature/live-location-window

name: Apply live location UI integration

on:
  push:
    branches:
      - feature/live-location-window

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: feature/live-location-window

      - name: Patch GroupChat
        shell: python
        run: |
          from pathlib import Path

          path = Path('nexus-premium-ui/components/nexus/group-chat.tsx')
          text = path.read_text()

          import_line = "import { LiveLocationWindow } from './live-location-window'\n"
          anchor = "import { supabase } from '@/lib/supabase'\n"
          if import_line not in text:
              if anchor not in text:
                  raise SystemExit('Could not find GroupChat import anchor')
              text = text.replace(anchor, anchor + import_line, 1)

          render_anchor = "  return (\n    <>\n      <div className=\"flex flex-col overflow-hidden rounded-xl border border-border/20 bg-black/20\""
          replacement = "  return (\n    <>\n      <LiveLocationWindow groupId={groupId} />\n      <div className=\"flex flex-col overflow-hidden rounded-xl border border-border/20 bg-black/20\""
          if "<LiveLocationWindow groupId={groupId} />" not in text:
              if render_anchor not in text:
                  raise SystemExit('Could not find GroupChat render anchor')
              text = text.replace(render_anchor, replacement, 1)

          path.write_text(text)

      - name: Verify integration
        run: |
          grep -q "LiveLocationWindow" nexus-premium-ui/components/nexus/group-chat.tsx
          test -f nexus-premium-ui/components/nexus/live-location-window.tsx

      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nexus-premium-ui/components/nexus/group-chat.tsx .github/workflows/apply-live-location-ui.yml
          git rm .github/workflows/apply-live-location-ui.yml
          git commit -m "feat: surface live location during Golden Window"
          git push origin HEAD:feature/live-location-window

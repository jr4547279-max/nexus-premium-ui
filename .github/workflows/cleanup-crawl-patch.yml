name: Cleanup Crawl Patch
on:
  push:
    branches: [feature/group-crawl-integration]
permissions:
  contents: write
jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove unused wiring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('nexus-premium-ui/components/nexus/venue-recommendations.tsx')
          s=p.read_text()
          s=s.replace("\nimport { saveVenueToGroup } from '@/lib/saved-venue-service'", "")
          start=s.find("\n  const handleSaveToGroup = async (venue: Venue) => {")
          if start != -1:
              end=s.find("\n\n  const mapUrl", start)
              if end == -1: raise SystemExit('cleanup endpoint not found')
              s=s[:start]+s[end:]
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nexus-premium-ui/components/nexus/venue-recommendations.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix: remove unused nearby crawl wiring"
          git push

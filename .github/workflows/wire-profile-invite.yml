name: Wire profile invite modal
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  wire:
    if: contains(github.event.head_commit.message, 'wire premium profile invite modal trigger')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire group modal props
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('nexus-premium-ui/components/nexus/group-detail.tsx')
          s = p.read_text()
          old = '''      <InviteMemberModal\n        open={inviteOpen}\n        onOpenChange={setInviteOpen}\n        groupName={name}\n        inviteCode={inviteCode}\n      />'''
          new = '''      <InviteMemberModal\n        open={inviteOpen}\n        onOpenChange={setInviteOpen}\n        groupName={name}\n        inviteCode={inviteCode}\n        groupId={groupId}\n        onMemberAdded={() => window.location.reload()}\n      />'''
          if old not in s:
              raise SystemExit('expected InviteMemberModal block not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nexus-premium-ui/components/nexus/group-detail.tsx
          git commit -m 'fix: wire username invite into premium group detail'
          git push origin HEAD:main

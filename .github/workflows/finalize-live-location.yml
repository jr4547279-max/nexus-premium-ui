name: Finalize live location member presentation

on:
  push:
    branches:
      - feature/live-location-window

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/live-location-window

      - name: Patch component
        shell: python
        run: |
          from pathlib import Path

          component = Path('nexus-premium-ui/components/nexus/live-location-window.tsx')
          text = component.read_text()
          text = text.replace("import { Check, Clock3, LocateFixed, MapPin, Navigation, Radio, Shield, Users, X } from 'lucide-react'", "import { Check, Clock3, LocateFixed, MapPin, Radio, Shield } from 'lucide-react'")
          text = text.replace("interface LiveLocationWindowProps {\n  groupId: string\n}", "interface LiveLocationMember {\n  user_id: string\n  display_name?: string | null\n}\n\ninterface LiveLocationWindowProps {\n  groupId: string\n  members?: LiveLocationMember[]\n}")
          text = text.replace("export function LiveLocationWindow({ groupId }: LiveLocationWindowProps) {", "export function LiveLocationWindow({ groupId, members: groupMembers = [] }: LiveLocationWindowProps) {")
          text = text.replace("    members,\n    isSharing,", "    members: presenceMembers,\n    isSharing,")
          text = text.replace("  const memberById = useMemo(() => new Map(members.map((member) => [member.user_id, member])), [members])\n  const sharingCount = locations.length", "  const members = groupMembers.length > 0 ? groupMembers : presenceMembers\n  const memberById = useMemo(() => new Map(presenceMembers.map((member) => [member.user_id, member])), [presenceMembers])\n  const sharingCount = locations.length")
          text = text.replace("<p className=\"truncate text-xs font-medium\">{member.user_id === location?.user_id ? 'Sharing now' : 'Group member'}</p>", "<p className=\"truncate text-xs font-medium\">{member.user_id === location?.user_id ? 'Sharing now' : (member.display_name || 'Group member')}</p>")
          component.write_text(text)

          detail = Path('nexus-premium-ui/components/nexus/group-detail.tsx')
          text = detail.read_text()
          text = text.replace('<LiveLocationWindow groupId={groupId} />', '<LiveLocationWindow groupId={groupId} members={realMembers} />', 1)
          detail.write_text(text)

      - name: Build
        run: |
          npm install -g pnpm@10.17.1
          pnpm install --no-frozen-lockfile
          pnpm --filter my-project build

      - name: Commit and remove workflow
        if: ${{ success() }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nexus-premium-ui/components/nexus/live-location-window.tsx nexus-premium-ui/components/nexus/group-detail.tsx .github/workflows/finalize-live-location.yml
          git rm .github/workflows/finalize-live-location.yml
          git commit -m "fix: show group member names in live location"
          git push origin HEAD:feature/live-location-window

name: Nexus map sync

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync-map-location:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch passive geolocation sync
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('nexus-premium-ui/components/nexus/world-map.tsx')
          text = path.read_text()
          old = """          navigator.geolocation?.getCurrentPosition((position) => {\n            locationRef.current = { lat: position.coords.latitude, lng: position.coords.longitude }\n            void loadVenues(position.coords.latitude, position.coords.longitude, vibe)\n          }, () => undefined, { enableHighAccuracy: false, timeout: 5000, maximumAge: 300000 })"""
          new = """          navigator.geolocation?.getCurrentPosition((position) => {\n            const next = { lat: position.coords.latitude, lng: position.coords.longitude }\n            locationRef.current = next\n            map?.flyTo({ center: [next.lng, next.lat], zoom: 13, pitch: 42, bearing: 0, duration: 1400, essential: true })\n            void loadVenues(next.lat, next.lng, vibe)\n          }, () => undefined, { enableHighAccuracy: false, timeout: 5000, maximumAge: 300000 })"""
          if old not in text:
              raise SystemExit('Expected geolocation block was not found; refusing to modify the file.')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit source change and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nexus-premium-ui/components/nexus/world-map.tsx .github/workflows/nexus-map-sync.yml
          git rm .github/workflows/nexus-map-sync.yml
          git commit -m "fix: keep venue markers aligned with detected location"
          git push

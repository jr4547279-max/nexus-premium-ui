name: Add Nearby Crawl Button Final
on:
  push:
    branches: [feature/group-crawl-integration]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch
        run: |
          python3 -c "from pathlib import Path; p=Path('nexus-premium-ui/components/nexus/venue-recommendations.tsx'); s=p.read_text(); marker='              <VoteButton\\n                active={vote === 1}'; add='              {venue.lat != null && venue.lng != null && (\\n                <button type=\\\"button\\\" onClick={(e) => { e.stopPropagation(); window.dispatchEvent(new CustomEvent(\\\'nexus:crawl-candidate\\\', { detail: venue })) }} className=\\\"flex items-center gap-1 px-2 py-1 rounded-md border border-primary/25 bg-primary/[0.05] text-[11px] text-primary hover:bg-primary/10 transition-all\\\" aria-label={`Add ${venue.name} to pub crawl`}>＋ Crawl</button>\\n              )}\\n'+marker; p.write_text(s.replace(marker, add, 1) if 'nexus:crawl-candidate' not in s else s)"
      - name: Validate
        run: |
          cd nexus-premium-ui
          corepack enable
          pnpm install --no-frozen-lockfile
          pnpm exec tsc --noEmit
          pnpm run build
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nexus-premium-ui/components/nexus/venue-recommendations.tsx
          git diff --cached --quiet || git commit -m 'feat: add Nearby Fits crawl button'
          git push

name: Patch Nexus crawl integration
on:
  push:
    branches: [feature/group-crawl-integration]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor == 'jr4547279-max'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply crawl integration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('nexus-premium-ui')
          p = root / 'components/nexus/venue-recommendations.tsx'
          s = p.read_text()
          old = """              {venue.maps_url && (\n                <a\n                  href={venue.maps_url}\n                  target=\"_blank\"\n                  rel=\"noopener noreferrer\"\n                  onClick={(e) => e.stopPropagation()}\n                  className=\"flex items-center gap-1 px-2 py-1 rounded-md border border-border/40 text-[11px] text-muted-foreground hover:text-foreground hover:border-border transition-all\"\n                  aria-label={`Open ${venue.name} in Google Maps`}\n                >\n                  <ExternalLink className=\"w-3 h-3\" aria-hidden=\"true\" />\n                  Maps\n                </a>\n              )}\n"""
          new = old + """              {venue.lat != null && venue.lng != null && (\n                <button\n                  type=\"button\"\n                  onClick={(e) => {\n                    e.stopPropagation()\n                    window.dispatchEvent(new CustomEvent('nexus:crawl-candidate', { detail: venue }))\n                  }}\n                  className=\"flex items-center gap-1 px-2 py-1 rounded-md border border-primary/25 bg-primary/[0.05] text-[11px] text-primary hover:bg-primary/10 transition-all\"\n                  aria-label={`Add ${venue.name} to pub crawl`}\n                >\n                  <span aria-hidden=\"true\">＋</span>\n                  Crawl\n                </button>\n              )}\n"""
          if old not in s: raise SystemExit('Nearby Fits insertion point not found')
          p.write_text(s.replace(old, new, 1))

          p = root / 'components/nexus/pub-crawl-plan-v2.tsx'
          s = p.read_text()
          s = s.replace("import { useState } from 'react'", "import { useEffect, useMemo, useState } from 'react'", 1)
          s = s.replace("import type { PlannerVenue } from '@/lib/planners/types'", "import type { PlannerVenue } from '@/lib/planners/types'\nimport type { Venue } from '@/lib/venue-service'", 1)
          marker = """function price(level: number): string {\n  return '£'.repeat(Math.max(1, Math.min(4, level)))\n}\n"""
          helper = marker + r'''\nfunction venueToPlannerVenue(venue: Venue): PlannerVenue {\n  const parsedPrice = venue.price_level?.match(/\d+/)?.[0]\n  const priceLevel = Math.max(1, Math.min(4, Number(parsedPrice || 2))) as PlannerVenue['priceLevel']\n  return {\n    id: venue.id || venue.maps_url || `${venue.name}|${venue.address || ''}`,\n    name: venue.name, lat: venue.lat!, lng: venue.lng!, rating: venue.rating ?? 0, priceLevel,\n    openingTime: '00:00', closingTime: '23:59', atmosphere: ['social'], tags: [venue.category || 'venue'],\n    estimatedCostPerPerson: 0, capacity: 'medium', features: [], distanceFromCentre: venue.distance_km ?? 0,\n    mapsUrl: venue.maps_url, address: venue.address, isRealData: true, ratingKnown: venue.rating != null,\n    priceLevelKnown: !!venue.price_level, openingHoursKnown: false,\n  }\n}\n\nfunction distanceKm(a: PlannerVenue, b: PlannerVenue): number {\n  const R = 6371, rad = (x: number) => x * Math.PI / 180\n  const dLat = rad(b.lat - a.lat), dLng = rad(b.lng - a.lng)\n  const h = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLng / 2) ** 2\n  return R * 2 * Math.atan2(Math.sqrt(h), Math.sqrt(1 - h))\n}\nfunction timeToMinutes(time: string): number { const [h, m] = time.split(':').map(Number); return h * 60 + m }\nfunction addMinutes(time: string, mins: number): string { const total = timeToMinutes(time) + mins; const h = Math.floor(total / 60) % 24; const m = total % 60; return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}` }\nfunction roleFor(index: number, total: number): string {\n  if (total <= 1) return ''; if (index === 0) return 'Opener'; if (index === total - 1) return 'Finale';\n  if (total === 3) return 'Mid-crawl'; return (index - 1) / (total - 2) < 0.5 ? 'Building' : 'Peak'\n}\nfunction rebuildPlan(plan: PlannerResult, venues: PlannerVenue[]): PlannerResult {\n  const startTime = plan.stops[0]?.arrivalTime || '18:00'; let currentTime = startTime\n  const stops = venues.map((venue, index) => {\n    const previous = index > 0 ? venues[index - 1] : null\n    const distance = previous ? distanceKm(previous, venue) : 0\n    const walk = previous ? Math.max(1, Math.round(distance / 0.083)) : 0\n    if (previous) currentTime = addMinutes(currentTime, walk)\n    const arrivalTime = currentTime, departureTime = addMinutes(arrivalTime, 42); currentTime = departureTime\n    return { order: index + 1, venue, arrivalTime, departureTime, walkingFromPrevious: walk,\n      distanceFromPrevious: Math.round(distance * 100) / 100,\n      score: { total: 0, breakdown: { rating: 0, distance: 0, price: 0, atmosphere: 0, openingHours: 0, capacity: 0 } },\n      role: roleFor(index, venues.length), reason: index === 0 ? 'Added by your group' : 'Added to your crawl route' }\n  })\n  const totalDistanceKm = Math.round(stops.reduce((sum, stop) => sum + stop.distanceFromPrevious, 0) * 10) / 10\n  const walkingMinutes = stops.reduce((sum, stop) => sum + stop.walkingFromPrevious, 0)\n  const durationMinutes = venues.length * 42 + walkingMinutes\n  const avgPrice = venues.length ? Math.round(venues.reduce((sum, venue) => sum + venue.priceLevel, 0) / venues.length) : 2\n  return { ...plan, stops, totalDistanceKm, walkingMinutes, durationMinutes, estimatedCostLabel: price(avgPrice),\n    explanation: 'Your group has customised this crawl. Nexus has rebuilt the stop order and walking times around your chosen venues.',\n    warnings: [...plan.warnings, 'This crawl includes a venue chosen by your group.'], generatedAt: new Date().toISOString() }\n}\n'''
          if marker not in s: raise SystemExit('Pub crawl helper marker not found')
          s = s.replace(marker, helper, 1)
          old_state = """  const [selectedStop, setSelectedStop] = useState<PlannerResult['stops'][number] | null>(null)\n  const selectedVenue = selectedStop?.venue ? richVenue(selectedStop.venue) : null\n"""
          new_state = """  const [selectedStop, setSelectedStop] = useState<PlannerResult['stops'][number] | null>(null)\n  const [localPlan, setLocalPlan] = useState<PlannerResult>(plan)\n  const [crawlCandidate, setCrawlCandidate] = useState<Venue | null>(null)\n  const [replaceOpen, setReplaceOpen] = useState(false)\n  const selectedVenue = selectedStop?.venue ? richVenue(selectedStop.venue) : null\n\n  useEffect(() => { setLocalPlan(plan) }, [plan])\n  useEffect(() => {\n    const handler = (event: Event) => {\n      const detail = (event as CustomEvent<Venue>).detail\n      if (detail?.name && detail.lat != null && detail.lng != null) setCrawlCandidate(detail)\n    }\n    window.addEventListener('nexus:crawl-candidate', handler)\n    return () => window.removeEventListener('nexus:crawl-candidate', handler)\n  }, [])\n  const candidatePlannerVenue = useMemo(() => crawlCandidate ? venueToPlannerVenue(crawlCandidate) : null, [crawlCandidate])\n  const applyCandidate = (mode: 'add' | 'replace', replaceOrder?: number) => {\n    if (!candidatePlannerVenue) return\n    const current = localPlan.stops.flatMap(stop => stop.venue ? [stop.venue] : [])\n    if (!current.length) return\n    let next: PlannerVenue[]\n    if (mode === 'replace' && replaceOrder != null) {\n      next = current.map((venue, index) => index + 1 === replaceOrder ? candidatePlannerVenue : venue)\n    } else {\n      let bestIndex = current.length, bestExtra = Infinity\n      for (let i = 0; i < current.length; i++) {\n        const before = current[i], after = current[i + 1]\n        const extra = after ? distanceKm(before, candidatePlannerVenue) + distanceKm(candidatePlannerVenue, after) - distanceKm(before, after) : distanceKm(before, candidatePlannerVenue)\n        if (extra < bestExtra) { bestExtra = extra; bestIndex = i + 1 }\n      }\n      next = [...current.slice(0, bestIndex), candidatePlannerVenue, ...current.slice(bestIndex)]\n    }\n    setLocalPlan(rebuildPlan(localPlan, next)); setCrawlCandidate(null); setReplaceOpen(false)\n  }\n"""
          if old_state not in s: raise SystemExit('Pub crawl state marker not found')
          s = s.replace(old_state, new_state, 1)
          body_start = s.index('export function PubCrawlPlanV2')
          prefix, body = s[:body_start], s[body_start:]
          for name in ['goldenWindowQuality','durationMinutes','title','subtitle','stops','totalDistanceKm','estimatedCostLabel','explanation','warnings']:
              body = body.replace(f'plan.{name}', f'localPlan.{name}')
          s = prefix + body
          needle = """      {selectedVenue && selectedStop && typeof document !== 'undefined' && createPortal("""
          insert = r'''      {crawlCandidate && candidatePlannerVenue && typeof document !== 'undefined' && createPortal(\n        <div className="fixed inset-0 z-[10000] flex items-end sm:items-center justify-center bg-black/75 backdrop-blur-sm p-0 sm:p-4" role="dialog" aria-modal="true" aria-label="Add venue to pub crawl" onClick={() => setCrawlCandidate(null)}>\n          <div className="w-full sm:max-w-md rounded-t-2xl sm:rounded-2xl border border-primary/20 bg-[#05080f] p-5 shadow-[0_0_80px_rgba(251,191,36,0.12)]" onClick={(event) => event.stopPropagation()}>\n            <div className="flex items-start justify-between gap-3"><div><p className="text-[10px] uppercase tracking-[0.18em] text-primary font-semibold">Pub crawl</p><h3 className="text-lg font-bold mt-1">{crawlCandidate.name}</h3><p className="text-xs text-muted-foreground mt-1">Choose how this nearby venue should change your crawl.</p></div><button type="button" onClick={() => setCrawlCandidate(null)} className="h-9 w-9 rounded-full border border-white/10 bg-white/[0.03] flex items-center justify-center" aria-label="Close"><X className="w-4 h-4" /></button></div>\n            <div className="grid gap-2 mt-5"><button type="button" onClick={() => applyCandidate('add')} className="rounded-xl border border-primary/30 bg-primary/[0.08] p-3 text-left hover:bg-primary/[0.12]"><span className="block text-sm font-semibold">Add as a new stop</span><span className="block text-[11px] text-muted-foreground mt-0.5">Nexus inserts it where it adds the least walking.</span></button><button type="button" onClick={() => setReplaceOpen(true)} className="rounded-xl border border-white/10 bg-white/[0.03] p-3 text-left hover:bg-white/[0.05]"><span className="block text-sm font-semibold">Replace a stop</span><span className="block text-[11px] text-muted-foreground mt-0.5">Choose which current pub this venue should replace.</span></button></div>\n            {replaceOpen && <div className="mt-4 border-t border-white/10 pt-4 space-y-2"><p className="text-[10px] uppercase tracking-widest text-muted-foreground">Replace…</p>{localPlan.stops.map((stop) => stop.venue && <button key={stop.order} type="button" onClick={() => applyCandidate('replace', stop.order)} className="w-full rounded-xl border border-white/10 bg-white/[0.02] px-3 py-2.5 text-left hover:bg-white/[0.05] flex items-center justify-between gap-3"><span className="text-sm">{stop.order}. {stop.venue.name}</span><span className="text-[10px] text-muted-foreground">Replace</span></button>)}</div>}\n          </div>\n        </div>, document.body,\n      )}\n\n'''
          if needle not in s: raise SystemExit('Pub crawl portal insertion point not found')
          p.write_text(s.replace(needle, insert + needle, 1))
          PY
      - name: Typecheck and build
        run: |
          cd nexus-premium-ui
          corepack enable
          pnpm install --frozen-lockfile
          pnpm exec tsc --noEmit
          pnpm run build
      - name: Commit patched files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nexus-premium-ui/components/nexus/venue-recommendations.tsx nexus-premium-ui/components/nexus/pub-crawl-plan-v2.tsx
          git diff --cached --quiet || git commit -m 'feat: integrate nearby venues with pub crawl'
          git push

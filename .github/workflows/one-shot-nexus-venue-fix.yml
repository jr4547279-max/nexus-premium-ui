name: Nexus venue fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ hashFiles('.nexus-venue-fix-pending') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply activity-aware venue routing
        run: |
          python3 <<'PY'
          from pathlib import Path

          root = Path('nexus-premium-ui')

          p = root / 'components/nexus/venue-recommendations.tsx'
          s = p.read_text()
          s = s.replace(
              "const VIBES: Vibe[] = ['pub', 'drinks', 'food', 'coffee', 'activity']",
              """const VIBES: Vibe[] = ['pub', 'drinks', 'food', 'coffee', 'activity']

          const ACTIVITY_VIBE: Record<string, Vibe> = {
            'pub-crawl': 'pub',
            'cocktail-bar': 'drinks',
            'restaurant': 'food',
            'brunch': 'food',
            'coffee': 'coffee',
            'gym': 'activity',
            'swimming': 'activity',
            'beach': 'activity',
            'picnic': 'activity',
            'board-games': 'activity',
            'cinema': 'activity',
            'bowling': 'activity',
            'live-music': 'activity',
            'escape-room': 'activity',
          }"""
          )
          s = s.replace(
              "const [vibe, setVibe] = useState<Vibe>(intent.vibe)",
              "const activityVibe = activityId ? ACTIVITY_VIBE[activityId] : undefined\n  const requestedVibe = activityVibe ?? intent.vibe\n  const [vibe, setVibe] = useState<Vibe>(requestedVibe)"
          )
          s = s.replace(
              "setVibe(intent.vibe)\n  }, [intent.vibe])",
              "setVibe(requestedVibe)\n  }, [requestedVibe])"
          )
          s = s.replace(
              "fetchVenues({\n      vibe,",
              "fetchVenues({\n      vibe,\n      activityId,"
          )
          s = s.replace(
              "[vibe, midpoint.lat, midpoint.lng, midpoint.fallback, goldenWindow?.day_of_week,",
              "[vibe, activityId, midpoint.lat, midpoint.lng, midpoint.fallback, goldenWindow?.day_of_week,"
          )
          p.write_text(s)

          p = root / 'lib/venue-service.ts'
          s = p.read_text()
          s = s.replace(
              "  vibe: Vibe\n  lat?: number",
              "  vibe: Vibe\n  activityId?: string\n  lat?: number"
          )
          s = s.replace(
              "const qs = new URLSearchParams({ vibe: opts.vibe })",
              "const qs = new URLSearchParams({ vibe: opts.vibe })\n  if (opts.activityId) qs.set('activity', opts.activityId)"
          )
          p.write_text(s)

          p = root / 'app/nx/places/route.ts'
          s = p.read_text()
          s = s.replace(
              "const VIBE_QUERIES: Record<string, string> = {",
              """const ACTIVITY_SEARCH: Record<string, { query: string; type?: string }> = {
            'gym': { query: 'gyms', type: 'gym' },
            'swimming': { query: 'swimming pools', type: 'swimming_pool' },
            'beach': { query: 'beaches', type: 'beach' },
            'picnic': { query: 'picnic areas', type: 'picnic_ground' },
            'pub-crawl': { query: 'pubs', type: 'pub' },
            'cocktail-bar': { query: 'cocktail bars', type: 'cocktail_bar' },
            'board-games': { query: 'board game cafes' },
            'restaurant': { query: 'restaurants', type: 'restaurant' },
            'brunch': { query: 'brunch restaurants', type: 'brunch_restaurant' },
            'coffee': { query: 'cafes and coffee shops', type: 'cafe' },
            'cinema': { query: 'cinemas', type: 'movie_theater' },
            'bowling': { query: 'bowling alleys', type: 'bowling_alley' },
            'live-music': { query: 'live music venues', type: 'live_music_venue' },
            'escape-room': { query: 'escape rooms' },
          }

          const VIBE_QUERIES: Record<string, string> = {"""
          )
          s = s.replace(
              "const vibeRaw = (url.searchParams.get('vibe') ?? 'drinks').toLowerCase()\n  const vibe = (VIBE_QUERIES[vibeRaw] ? vibeRaw : 'drinks') as keyof typeof VIBE_QUERIES",
              "const vibeRaw = (url.searchParams.get('vibe') ?? 'drinks').toLowerCase()\n  const vibe = (VIBE_QUERIES[vibeRaw] ? vibeRaw : 'drinks') as keyof typeof VIBE_QUERIES\n  const activityId = (url.searchParams.get('activity') ?? '').toLowerCase()\n  const activitySearch = ACTIVITY_SEARCH[activityId]\n  const searchQuery = activitySearch?.query ?? VIBE_QUERIES[vibe]"
          )
          s = s.replace(
              "const cacheKey = `${vibe}|${lat.toFixed(3)}|${lng.toFixed(3)}|${radius}|${limit}`",
              "const cacheKey = `${activityId || vibe}|${lat.toFixed(3)}|${lng.toFixed(3)}|${radius}|${limit}`"
          )
          s = s.replace(
              "textQuery: VIBE_QUERIES[vibe],",
              "textQuery: searchQuery,"
          )
          s = s.replace(
              "if (vibe === 'pub') {\n      body.includedType = 'pub'\n      body.strictTypeFiltering = true\n    }",
              "if (activitySearch?.type) {\n      body.includedType = activitySearch.type\n      body.strictTypeFiltering = true\n    } else if (vibe === 'pub') {\n      body.includedType = 'pub'\n      body.strictTypeFiltering = true\n    }"
          )
          p.write_text(s)

          p = root / 'lib/planners/providers/real-venue-provider.ts'
          p.write_text(r'''import type { PlannerVenue, VenueProvider } from '../types'
          import { fetchVenues, type Vibe } from '../../venue-service'

          const ACTIVITY_VIBE: Record<string, Vibe> = {
            'pub-crawl': 'pub',
            'cocktail-bar': 'drinks',
            'restaurant': 'food',
            'brunch': 'food',
            'coffee': 'coffee',
            'gym': 'activity',
            'swimming': 'activity',
            'beach': 'activity',
            'picnic': 'activity',
            'board-games': 'activity',
            'cinema': 'activity',
            'bowling': 'activity',
            'live-music': 'activity',
            'escape-room': 'activity',
          }

          export class RealVenueProvider implements VenueProvider {
            private readonly radiusMetres: number
            constructor(radiusMetres = 1500) { this.radiusMetres = radiusMetres }

            async getVenues(activityId: string, location?: { lat: number; lng: number }): Promise<PlannerVenue[]> {
              if (!location) return []
              const vibe = ACTIVITY_VIBE[activityId] ?? 'activity'
              const result = await fetchVenues({
                vibe,
                activityId,
                lat: location.lat,
                lng: location.lng,
                radius: this.radiusMetres,
                limit: 12,
              })

              return result.venues.map((v, index) => ({
                id: v.id ?? `real-${activityId}-${index}-${v.lat}-${v.lng}`,
                name: v.name,
                lat: v.lat ?? location.lat,
                lng: v.lng ?? location.lng,
                rating: v.rating ?? 0,
                ratingKnown: v.rating != null,
                priceLevel: ({
                  PRICE_LEVEL_FREE: 1,
                  PRICE_LEVEL_INEXPENSIVE: 1,
                  PRICE_LEVEL_MODERATE: 2,
                  PRICE_LEVEL_EXPENSIVE: 3,
                  PRICE_LEVEL_VERY_EXPENSIVE: 4,
                } as Record<string, 1 | 2 | 3 | 4>)[v.price_level ?? 'PRICE_LEVEL_MODERATE'] ?? 2,
                priceLevelKnown: !!v.price_level,
                openingTime: '00:00',
                closingTime: '23:59',
                openingHoursKnown: v.open_now != null,
                atmosphere: [],
                tags: [v.category ?? activityId].filter(Boolean),
                estimatedCostPerPerson: 0,
                capacity: 'medium',
                features: [],
                distanceFromCentre: v.distance_km ?? 0,
                mapsUrl: v.maps_url,
                address: v.address,
                photoUrl: v.photo_url,
                website: null,
                isRealData: true,
              }))
            }
          }
          ''')

          marker = Path('.nexus-venue-fix-pending')
          marker.unlink(missing_ok=True)
          workflow = Path('.github/workflows/one-shot-nexus-venue-fix.yml')
          workflow.unlink(missing_ok=True)
          PY

          git config user.name "nexus-fix-bot"
          git config user.email "nexus-fix-bot@users.noreply.github.com"
          git add nexus-premium-ui .github/workflows/one-shot-nexus-venue-fix.yml .nexus-venue-fix-pending
          git commit -m "Fix activity-specific venue discovery"
          git push

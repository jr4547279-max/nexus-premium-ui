name: Apply Nexus activity fixes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-fixes:
    if: "!contains(github.event.head_commit.message, '[nexus-fix]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply UI patches
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          ROOT = Path('nexus-premium-ui')
          changed = False

          def replace(path, old, new, count=1):
              global changed
              p = ROOT / path
              text = p.read_text()
              if old in text:
                  p.write_text(text.replace(old, new, count))
                  print('PATCH OK', path, old[:70].replace('\n',' '))
                  changed = True
              else:
                  print('PATCH SKIP', path, old[:70].replace('\n',' '))

          def regex(path, pattern, replacement, count=1):
              global changed
              p = ROOT / path
              text = p.read_text()
              new_text, n = re.subn(pattern, replacement, text, count=count, flags=re.S)
              print('PATCH REGEX', path, 'matches=', n)
              if n:
                  p.write_text(new_text)
                  changed = True

          # Group detail: Golden Window becomes an optional timing layer for venue activities.
          replace('components/nexus/group-detail.tsx',
                  "import { WeatherChip } from './weather-chip'\n",
                  "import { WeatherChip } from './weather-chip'\nimport { GoldenWindowCountdown } from './golden-window-countdown'\n")
          replace('components/nexus/group-detail.tsx',
                  "{showRevealedContent && revealPhase === 'revealed' && !venuesRevealed && !isRouteActivity && (",
                  "{realMode && planningLocation && !venuesRevealed && !isRouteActivity && (")
          replace('components/nexus/group-detail.tsx',
                  "{showRevealedContent && venuesRevealed && !isRouteActivity && (",
                  "{realMode && venuesRevealed && !isRouteActivity && (")
          replace('components/nexus/group-detail.tsx',
                  "              groupName={realGroup?.name ?? null}\n              goldenWindow={{\n                day_of_week: activeWindow!.day_of_week,\n                start_time:  activeWindow!.start_time,\n                end_time:    activeWindow!.end_time,\n              }}",
                  "              groupName={realGroup?.name ?? null}\n              groupId={groupId}\n              activityId={rawActivityId}\n              goldenWindow={activeWindow ? {\n                day_of_week: activeWindow.day_of_week,\n                start_time: activeWindow.start_time,\n                end_time: activeWindow.end_time,\n              } : null}")
          replace('components/nexus/group-detail.tsx',
                  "disabled={!activeWindow}\n                      className={cn(\n                        'w-full h-11 rounded-xl',\n                        activeWindow\n                          ? 'bg-primary hover:bg-primary/90 text-primary-foreground glow-gold'\n                          : 'opacity-40 cursor-not-allowed',",
                  "disabled={!planningLocation}\n                      className={cn(\n                        'w-full h-11 rounded-xl',\n                        planningLocation\n                          ? 'bg-primary hover:bg-primary/90 text-primary-foreground glow-gold'\n                          : 'opacity-40 cursor-not-allowed',")
          replace('components/nexus/group-detail.tsx',
                  "Nexus will find the best venues near your group, score them, and build a plan — timed to your Golden Window.",
                  "Nexus will find the best venues near your group, score them, and build a plan. A Golden Window is optional — if you have one, Nexus will time the plan to it; otherwise timing stays flexible.")
          replace('components/nexus/group-detail.tsx',
                  "Nexus will find the best venues near you, score them, and build a plan — timed to your Golden Window.",
                  "Nexus will find the best venue near you, score it, and build a plan. A Golden Window is optional — if you have one, Nexus will time the plan to it; otherwise timing stays flexible.")
          regex('components/nexus/group-detail.tsx',
                r"(\{\(weatherLoading \|\| \(weather && !weather\.error\)\) && \(.*?\n\s*\)\})(\n\s*</GlassCard>)",
                r"\1\n\n            <GoldenWindowCountdown\n              daysUntil={activeWindow.days_until}\n              startTime={activeWindow.start_time}\n              endTime={activeWindow.end_time}\n            />\2")

          # Nearby fits: accept optional Golden Window context and refresh when it changes.
          replace('components/nexus/venue-recommendations.tsx',
                  "interface Props {\n  groupName: string | null",
                  "interface Props {\n  groupName: string | null\n  groupId?: string\n  activityId?: string")
          replace('components/nexus/venue-recommendations.tsx',
                  "export function VenueRecommendations({\n  groupName,\n  goldenWindow,",
                  "export function VenueRecommendations({\n  groupName,\n  groupId,\n  activityId,\n  goldenWindow,")
          replace('components/nexus/venue-recommendations.tsx',
                  "  }, [vibe, midpoint.lat, midpoint.lng, midpoint.fallback])",
                  "  }, [vibe, midpoint.lat, midpoint.lng, midpoint.fallback, goldenWindow?.day_of_week, goldenWindow?.start_time, goldenWindow?.end_time])")
          replace('components/nexus/venue-recommendations.tsx',
                  "        venue={selectedVenue}\n        vibe={vibe}",
                  "        venue={selectedVenue}\n        groupId={groupId}\n        activityId={activityId}\n        vibe={vibe}")

          # Venue detail: direct save into the current Pub Crawl group.
          replace('components/nexus/venue-detail-sheet.tsx',
                  "interface Props {\n  venue: Venue | null",
                  "interface Props {\n  venue: Venue | null\n  groupId?: string\n  activityId?: string")
          replace('components/nexus/venue-detail-sheet.tsx',
                  "export function VenueDetailSheet({ venue, vibe, goldenWindow, midpointFallback, weather, vote, onVote, onClose, intent }: Props)",
                  "export function VenueDetailSheet({ venue, groupId, activityId, vibe, goldenWindow, midpointFallback, weather, vote, onVote, onClose, intent }: Props)")
          replace('components/nexus/venue-detail-sheet.tsx',
                  "  const [savedGroupIds, setSavedGroupIds] = useState<string[]>([])\n",
                  "  const [savedGroupIds, setSavedGroupIds] = useState<string[]>([])\n  const [addingToCrawl, setAddingToCrawl] = useState(false)\n  const [crawlAdded, setCrawlAdded] = useState(false)\n")
          replace('components/nexus/venue-detail-sheet.tsx',
                  "    setSavedGroupIds([])\n    setSavingGroupId(null)\n",
                  "    setSavedGroupIds([])\n    setSavingGroupId(null)\n    setAddingToCrawl(false)\n    setCrawlAdded(false)\n")
          replace('components/nexus/venue-detail-sheet.tsx',
                  "  const handleToggleGroup = async (groupId: string) => {",
                  """  const handleAddToPubCrawl = async () => {
    if (!venue || !groupId || activityId !== 'pub-crawl' || addingToCrawl) return
    setAddingToCrawl(true)
    const result = await saveVenueToGroup(groupId, venue)
    if (result.ok) {
      setCrawlAdded(true)
      window.dispatchEvent(new CustomEvent('nexus:add-crawl-venue', {
        detail: {
          id: venue.id || venue.maps_url || `${venue.name}|${venue.address || ''}`,
          name: venue.name,
          category: venue.category,
          photo_url: venue.photo_url,
          maps_url: venue.maps_url,
          address: venue.address,
          rating: venue.rating,
          lat: venue.lat,
          lng: venue.lng,
          activityId: 'pub-crawl',
        },
      }))
    }
    setAddingToCrawl(false)
  }

  const handleToggleGroup = async (groupId: string) => {""")
          replace('components/nexus/venue-detail-sheet.tsx',
                  "        <section className=\"mx-4 mt-4\">\n          <button type=\"button\" onClick={openGroupPicker}",
                  """        {activityId === 'pub-crawl' && groupId && (
          <section className="mx-4 mt-4">
            <button type="button" onClick={handleAddToPubCrawl} disabled={addingToCrawl || crawlAdded} className={cn('w-full flex items-center justify-between gap-3 rounded-xl border px-4 py-3 text-left transition-colors', crawlAdded ? 'border-emerald-400/30 bg-emerald-400/[0.06]' : 'border-primary/30 bg-primary/[0.06] hover:bg-primary/[0.10]')}>
              <span className="flex items-center gap-3"><span className="flex items-center justify-center w-9 h-9 rounded-full bg-primary/10 border border-primary/20">{crawlAdded ? <Check className="w-4 h-4 text-emerald-300" /> : <Plus className="w-4 h-4 text-primary" />}</span><span><span className="block text-[12px] font-semibold">{crawlAdded ? 'Added to Pub Crawl' : 'Add to Pub Crawl'}</span><span className="block text-[11px] text-muted-foreground mt-0.5">{crawlAdded ? 'Saved to this group and ready for the crawl.' : 'Use this venue as one of your crawl stops.'}</span></span></span><span className="text-[11px] font-medium text-primary">{addingToCrawl ? 'Saving…' : crawlAdded ? 'Added' : 'Add'}</span>
            </button>
          </section>
        )}

        <section className="mx-4 mt-4">
          <button type="button" onClick={openGroupPicker}""")

          # Pub Crawl planner: saved group venues are first-class crawl candidates.
          replace('lib/planners/google-pub-crawl-planner.ts',
                  "import type { PlannerDefinition, PlannerResult, PlannerScore, PlannerVenue } from './types'\n",
                  "import type { PlannerDefinition, PlannerResult, PlannerScore, PlannerVenue } from './types'\nimport { listGroupSavedVenues } from '../saved-venue-service'\n")
          replace('lib/planners/google-pub-crawl-planner.ts',
                  "function mapVenue(place: PlacesVenue, index: number): { venue: PlannerVenue; openNow: boolean | null } | null {",
                  """function mapSavedVenue(saved: Awaited<ReturnType<typeof listGroupSavedVenues>>[number]): { venue: PlannerVenue; openNow: boolean | null } | null {
  if (!saved.venue_name || saved.venue_lat == null || saved.venue_lng == null) return null
  return { venue: { id: saved.place_id, name: saved.venue_name, lat: saved.venue_lat, lng: saved.venue_lng, rating: saved.venue_rating ?? 0, ratingKnown: saved.venue_rating != null, priceLevel: 2, priceLevelKnown: false, openingTime: '00:00', closingTime: '23:59', openingHoursKnown: false, atmosphere: ['social'], tags: [saved.venue_category || 'pub'], estimatedCostPerPerson: 0, capacity: 'medium', features: [], distanceFromCentre: 0, mapsUrl: saved.map_url ?? null, address: saved.venue_address ?? null, isRealData: true }, openNow: null }
}

function mapVenue(place: PlacesVenue, index: number): { venue: PlannerVenue; openNow: boolean | null } | null {""")
          replace('lib/planners/google-pub-crawl-planner.ts',
                  "    const mapped = places\n      .map(mapVenue)\n      .filter((item): item is { venue: PlannerVenue; openNow: boolean | null } => item !== null)\n",
                  """    const mappedPlaces = places
      .map(mapVenue)
      .filter((item): item is { venue: PlannerVenue; openNow: boolean | null } => item !== null)

    const saved = await listGroupSavedVenues(groupId)
    const savedMapped = saved
      .map(mapSavedVenue)
      .filter((item): item is { venue: PlannerVenue; openNow: boolean | null } => item !== null)
    const savedIds = new Set(savedMapped.map((item) => item.venue.id))
    const mapped = [...savedMapped, ...mappedPlaces.filter((item) => !savedIds.has(item.venue.id))]
""")

          if changed:
              print('Changes detected; leaving workflow for the commit step.')
          else:
              print('No source changes detected.')
          PY

      - name: Commit fixes and remove one-shot workflow
        run: |
          if git diff --quiet -- nexus-premium-ui; then
            echo 'No source changes; refusing to create an empty fix commit.'
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nexus-premium-ui
          git rm .github/workflows/apply-nexus-activity-fixes.yml
          git commit -m "fix: make activity planning and venue flow optional around Golden Window [nexus-fix]"
          git push origin main

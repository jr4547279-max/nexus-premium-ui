  push:
    branches: [feature/group-crawl-integration]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor == 'jr4547279-max'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('nexus-premium-ui')

          p = root / 'components/nexus/venue-recommendations.tsx'
          s = p.read_text()
          old = '''              {venue.maps_url && (
                <a
                  href={venue.maps_url}

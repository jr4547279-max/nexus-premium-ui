                  className="flex items-center gap-1 px-2 py-1 rounded-md border border-border/40 text-[11px] text-muted-foreground hover:text-foreground hover:border-border transition-all"
                  aria-label={`Open ${venue.name} in Google Maps`}
                >
                  <ExternalLink className="w-3 h-3" aria-hidden="true" />
                  Maps
                </a>
              )}
'''
          new = old + '''              {venue.lat != null && venue.lng != null && (
                <button
                  type="button"
                  onClick={(e) => {
                    e.stopPropagation()
                    window.dispatchEvent(new CustomEvent('nexus:crawl-candidate', { detail: venue }))
                  }}
                  className="flex items-center gap-1 px-2 py-1 rounded-md border border-primary/25 bg-primary/[0.05] text-[11px] text-primary hover:bg-primary/10 transition-all"
                  aria-label={`Add ${venue.name} to pub crawl`}
                >
                  <span aria-hidden="true">＋</span>
                  Crawl
                </button>
              )}
'''
          if 'nexus:crawl-candidate' not in s:
              if old not in s: raise SystemExit('Nearby Fits insertion point not found')
              p.write_text(s.replace(old, new, 1))

          p = root / 'components/nexus/pub-crawl-plan-v2.tsx'
          s = p.read_text()
          if 'nexus:crawl-candidate' not in s:
              s = s.replace("import { useState } from 'react'", "import { useEffect, useMemo, useState } from 'react'", 1)
              s = s.replace("import type { PlannerVenue } from '@/lib/planners/types'", "import type { PlannerVenue } from '@/lib/planners/types'\nimport type { Venue } from '@/lib/venue-service'", 1)
              marker = '''function price(level: number): string {
  return '£'.repeat(Math.max(1, Math.min(4, level)))
}
'''
              helper = marker + '''
function venueToPlannerVenue(venue: Venue): PlannerVenue {
  const parsedPrice = venue.price_level?.match(/\\d+/)?.[0]
  const priceLevel = Math.max(1, Math.min(4, Number(parsedPrice || 2))) as PlannerVenue['priceLevel']
  return {
    id: venue.id || venue.maps_url || `${venue.name}|${venue.address || ''}`,
    name: venue.name,
    lat: venue.lat!,
    lng: venue.lng!,
    rating: venue.rating ?? 0,
    priceLevel,
    openingTime: '00:00',
    closingTime: '23:59',
    atmosphere: ['social'],
    tags: [venue.category || 'venue'],
    estimatedCostPerPerson: 0,
    capacity: 'medium',
    features: [],
    distanceFromCentre: venue.distance_km ?? 0,
    mapsUrl: venue.maps_url,
    address: venue.address,
    isRealData: true,
    ratingKnown: venue.rating != null,
    priceLevelKnown: !!venue.price_level,
    openingHoursKnown: false,
  }
}

function crawlDistanceKm(a: PlannerVenue, b: PlannerVenue): number {
  const R = 6371
  const rad = (x: number) => x * Math.PI / 180
  const dLat = rad(b.lat - a.lat)
  const dLng = rad(b.lng - a.lng)
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLng / 2) ** 2
  return R * 2 * Math.atan2(Math.sqrt(h), Math.sqrt(1 - h))
}

function crawlTimeToMinutes(time: string): number {
  const [h, m] = time.split(':').map(Number)
  return h * 60 + m
}

function crawlAddMinutes(time: string, mins: number): string {
  const total = crawlTimeToMinutes(time) + mins
  const h = Math.floor(total / 60) % 24
  const m = total % 60
  return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`
}

function crawlRole(index: number, total: number): string {
  if (total <= 1) return ''
  if (index === 0) return 'Opener'
  if (index === total - 1) return 'Finale'
  if (total === 3) return 'Mid-crawl'
  return (index - 1) / (total - 2) < 0.5 ? 'Building' : 'Peak'
}

function rebuildCrawlPlan(plan: PlannerResult, venues: PlannerVenue[]): PlannerResult {
  const startTime = plan.stops[0]?.arrivalTime || '18:00'
  let currentTime = startTime
  const stops = venues.map((venue, index) => {
    const previous = index > 0 ? venues[index - 1] : null
    const distance = previous ? crawlDistanceKm(previous, venue) : 0
    const walking = previous ? Math.max(1, Math.round(distance / 0.083)) : 0
    if (previous) currentTime = crawlAddMinutes(currentTime, walking)
    const arrivalTime = currentTime
    const departureTime = crawlAddMinutes(arrivalTime, 42)
    currentTime = departureTime
    return {
      order: index + 1,
      venue,
      arrivalTime,
      departureTime,
      walkingFromPrevious: walking,
      distanceFromPrevious: Math.round(distance * 100) / 100,
      score: { total: 0, breakdown: { rating: 0, distance: 0, price: 0, atmosphere: 0, openingHours: 0, capacity: 0 } },
      role: crawlRole(index, venues.length),
      reason: index === 0 ? 'Added by your group' : 'Added to your crawl route',
    }
  })
  const totalDistanceKm = Math.round(stops.reduce((sum, stop) => sum + stop.distanceFromPrevious, 0) * 10) / 10
  const walkingMinutes = stops.reduce((sum, stop) => sum + stop.walkingFromPrevious, 0)
  const durationMinutes = venues.length * 42 + walkingMinutes
  const avgPrice = venues.length ? Math.round(venues.reduce((sum, venue) => sum + venue.priceLevel, 0) / venues.length) : 2
  return {
    ...plan,
    stops,
    totalDistanceKm,
    walkingMinutes,
    durationMinutes,
    estimatedCostLabel: price(avgPrice),
    explanation: 'Your group has customised this crawl. Nexus has rebuilt the stop order and walking times around your chosen venues.',
    warnings: [...plan.warnings, 'This crawl includes a venue chosen by your group.'],
    generatedAt: new Date().toISOString(),
  }
}
'''
              if marker not in s: raise SystemExit('Pub crawl helper marker not found')
              s = s.replace(marker, helper, 1)

              state = '''  const [selectedStop, setSelectedStop] = useState<PlannerResult['stops'][number] | null>(null)
  const selectedVenue = selectedStop?.venue ? richVenue(selectedStop.venue) : null
'''
              replacement = '''  const [selectedStop, setSelectedStop] = useState<PlannerResult['stops'][number] | null>(null)
  const [localPlan, setLocalPlan] = useState<PlannerResult>(plan)
  const [crawlCandidate, setCrawlCandidate] = useState<Venue | null>(null)
  const [replaceOpen, setReplaceOpen] = useState(false)
  const selectedVenue = selectedStop?.venue ? richVenue(selectedStop.venue) : null

  useEffect(() => {
    setLocalPlan(plan)
  }, [plan])

  useEffect(() => {
    const handler = (event: Event) => {
      const detail = (event as CustomEvent<Venue>).detail
      if (detail?.name && detail.lat != null && detail.lng != null) setCrawlCandidate(detail)
    }
    window.addEventListener('nexus:crawl-candidate', handler)
    return () => window.removeEventListener('nexus:crawl-candidate', handler)
  }, [])

  const candidatePlannerVenue = useMemo(
    () => crawlCandidate ? venueToPlannerVenue(crawlCandidate) : null,
    [crawlCandidate],
  )

  const applyCandidate = (mode: 'add' | 'replace', replaceOrder?: number) => {
    if (!candidatePlannerVenue) return
    const current = localPlan.stops.flatMap(stop => stop.venue ? [stop.venue] : [])
    if (!current.length) return
    let next: PlannerVenue[]
    if (mode === 'replace' && replaceOrder != null) {
      next = current.map((venue, index) => index + 1 === replaceOrder ? candidatePlannerVenue : venue)
    } else {
      let bestIndex = current.length
      let bestExtra = Infinity
      for (let i = 0; i < current.length; i++) {
        const before = current[i]
        const after = current[i + 1]
        const extra = after
          ? crawlDistanceKm(before, candidatePlannerVenue) + crawlDistanceKm(candidatePlannerVenue, after) - crawlDistanceKm(before, after)
          : crawlDistanceKm(before, candidatePlannerVenue)
        if (extra < bestExtra) {
          bestExtra = extra
          bestIndex = i + 1
        }
      }
      next = [...current.slice(0, bestIndex), candidatePlannerVenue, ...current.slice(bestIndex)]
    }
    setLocalPlan(rebuildCrawlPlan(localPlan, next))
    setCrawlCandidate(null)
    setReplaceOpen(false)
  }
'''
              if state not in s: raise SystemExit('Pub crawl state marker not found')
              s = s.replace(state, replacement, 1)

              start = s.index('export function PubCrawlPlanV2')
              prefix, body = s[:start], s[start:]
              for name in ['goldenWindowQuality','durationMinutes','title','subtitle','stops','totalDistanceKm','estimatedCostLabel','explanation','warnings']:
                  body = body.replace(f'plan.{name}', f'localPlan.{name}')
              s = prefix + body

              needle = "      {selectedVenue && selectedStop && typeof document !== 'undefined' && createPortal("
              insert = '''      {crawlCandidate && candidatePlannerVenue && typeof document !== 'undefined' && createPortal(
        <div className="fixed inset-0 z-[10000] flex items-end sm:items-center justify-center bg-black/75 backdrop-blur-sm p-0 sm:p-4" role="dialog" aria-modal="true" aria-label="Add venue to pub crawl" onClick={() => setCrawlCandidate(null)}>
          <div className="w-full sm:max-w-md rounded-t-2xl sm:rounded-2xl border border-primary/20 bg-[#05080f] p-5 shadow-[0_0_80px_rgba(251,191,36,0.12)]" onClick={(event) => event.stopPropagation()}>
            <div className="flex items-start justify-between gap-3">
              <div><p className="text-[10px] uppercase tracking-[0.18em] text-primary font-semibold">Pub crawl</p><h3 className="text-lg font-bold mt-1">{crawlCandidate.name}</h3><p className="text-xs text-muted-foreground mt-1">Choose how this nearby venue should change your crawl.</p></div>
              <button type="button" onClick={() => setCrawlCandidate(null)} className="h-9 w-9 rounded-full border border-white/10 bg-white/[0.03] flex items-center justify-center" aria-label="Close"><X className="w-4 h-4" /></button>
            </div>
            <div className="grid gap-2 mt-5">
              <button type="button" onClick={() => applyCandidate('add')} className="rounded-xl border border-primary/30 bg-primary/[0.08] p-3 text-left hover:bg-primary/[0.12]"><span className="block text-sm font-semibold">Add as a new stop</span><span className="block text-[11px] text-muted-foreground mt-0.5">Nexus inserts it where it adds the least walking.</span></button>
              <button type="button" onClick={() => setReplaceOpen(true)} className="rounded-xl border border-white/10 bg-white/[0.03] p-3 text-left hover:bg-white/[0.05]"><span className="block text-sm font-semibold">Replace a stop</span><span className="block text-[11px] text-muted-foreground mt-0.5">Choose which current pub this venue should replace.</span></button>
            </div>
            {replaceOpen && <div className="mt-4 border-t border-white/10 pt-4 space-y-2"><p className="text-[10px] uppercase tracking-widest text-muted-foreground">Replace…</p>{localPlan.stops.map((stop) => stop.venue && <button key={stop.order} type="button" onClick={() => applyCandidate('replace', stop.order)} className="w-full rounded-xl border border-white/10 bg-white/[0.02] px-3 py-2.5 text-left hover:bg-white/[0.05] flex items-center justify-between gap-3"><span className="text-sm">{stop.order}. {stop.venue.name}</span><span className="text-[10px] text-muted-foreground">Replace</span></button>)}</div>}
          </div>
        </div>,
        document.body,
      )}

'''
              if needle not in s: raise SystemExit('Pub crawl portal insertion point not found')
              s = s.replace(needle, insert + needle, 1)
              p.write_text(s)
          print('source patched')
          PY
      - name: Install and validate
        run: |
          cd nexus-premium-ui
          corepack enable
          pnpm install --no-frozen-lockfile

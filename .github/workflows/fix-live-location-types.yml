name: Fix live location member types

on:
  push:
    branches:
      - feature/live-location-window

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/live-location-window

      - name: Fix type narrowing
        shell: python
        run: |
          from pathlib import Path
          path = Path('nexus-premium-ui/components/nexus/live-location-window.tsx')
          text = path.read_text()
          old = "  const members = groupMembers.length > 0 ? groupMembers : presenceMembers\n  const memberById = useMemo(() => new Map(presenceMembers.map((member) => [member.user_id, member])), [presenceMembers])"
          new = "  const members: LiveLocationMember[] = groupMembers.length > 0\n    ? groupMembers\n    : presenceMembers.map((member) => ({ user_id: member.user_id }))\n  const memberById = useMemo(() => new Map(presenceMembers.map((member) => [member.user_id, member])), [presenceMembers])"
          if old not in text:
              raise SystemExit('Expected member normalization block was not found')
          path.write_text(text.replace(old, new, 1))

      - name: Build
        run: |
          npm install -g pnpm@10.17.1
          pnpm install --no-frozen-lockfile
          pnpm --filter my-project build

      - name: Commit and clean one-shot workflows
        if: ${{ success() }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nexus-premium-ui/components/nexus/live-location-window.tsx .github/workflows/fix-live-location-types.yml
          git rm .github/workflows/finalize-live-location.yml .github/workflows/fix-live-location-types.yml
          git commit -m "fix: normalize live location member types"
          git push origin HEAD:feature/live-location-window

name: Restore group detail

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restore:
    if: contains(github.event.head_commit.message, 'connect premium group invite modal')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore group detail from known good commit
        run: |
          git checkout 01f9b3100816d973e1c14ecd553af3ef11808242 -- nexus-premium-ui/components/nexus/group-detail.tsx
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nexus-premium-ui/components/nexus/group-detail.tsx
          git commit -m 'fix: restore premium group detail implementation' || exit 0
          git push origin HEAD:main

name: Nexus build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install -g pnpm@10.17.1
      - run: pnpm install --no-frozen-lockfile

      - name: TypeScript and production build
        run: pnpm --filter my-project build

      - name: ESLint diagnostics
        run: |
          set +e
          pnpm --dir nexus-premium-ui run lint 2>&1 | tee lint.log
          status=${PIPESTATUS[0]}
          echo "$status" > lint.exit
          exit 0

      - name: Upload lint diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-lint-diagnostics
          path: |
            lint.log
            lint.exit

      - name: Fail if ESLint failed
        run: test "$(cat lint.exit)" -eq 0

name: Nexus build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply activity fixes
        if: "!contains(github.event.head_commit.message, '[nexus-fix]') && !contains(github.event.head_commit.message, '[build-log]')"
        run: python3 scripts/apply-activity-fixes.py

      - name: Remove duplicate venue detail props
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('nexus-premium-ui/components/nexus/venue-detail-sheet.tsx')
          text = path.read_text()
          start = text.index('interface Props {')
          end = text.index('\n}', start)
          block = text[start:end]
          seen = set()
          cleaned = []
          for line in block.splitlines():
              key = line.strip()
              if key in {'groupId?: string', 'activityId?: string'}:
                  if key in seen:
                      continue
                  seen.add(key)
              cleaned.append(line)
          new_block = '\n'.join(cleaned)
          path.write_text(text[:start] + new_block + text[end:])
          print('Venue detail prop cleanup complete.')
          PY

      - name: Commit source fixes
        if: "!contains(github.event.head_commit.message, '[nexus-fix]') && !contains(github.event.head_commit.message, '[build-log]')"
        run: |
          if git diff --quiet -- nexus-premium-ui; then
            echo "No source cleanup changes needed."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add nexus-premium-ui
            git commit -m "fix: clean duplicate venue detail props [nexus-fix]"
            git push origin main
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g pnpm@10.17.1
      - run: pnpm install --no-frozen-lockfile
      - name: Build and capture output
        run: |
          set -o pipefail
          pnpm --filter my-project build 2>&1 | tee build-output.log

      - name: Commit build output on failure
        if: ${{ failure() && !contains(github.event.head_commit.message, '[build-log]') }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build-output.log
          git commit -m "chore: capture build output [build-log]"
          git push origin main

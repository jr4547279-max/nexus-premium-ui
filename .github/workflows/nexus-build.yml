name: Nexus build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install -g pnpm@10.17.1
      - run: pnpm install --no-frozen-lockfile

      - name: Build Nexus
        run: pnpm --filter my-project build

name: Verify live location group placement

on:
  push:
    branches:
      - feature/live-location-window

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/live-location-window
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g pnpm@10.17.1
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter my-project build
      - name: Remove verifier
        if: ${{ success() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/verify-live-location-2.yml
          git commit -m "chore: remove live location group verifier"
          git push origin HEAD:feature/live-location-window

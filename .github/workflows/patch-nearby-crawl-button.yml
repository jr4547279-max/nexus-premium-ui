name: Add nearby crawl action
on:
  push:
    branches: [feature/group-crawl-integration]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor == 'jr4547279-max'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Nearby Fits crawl action
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('nexus-premium-ui/components/nexus/venue-recommendations.tsx')
          s = p.read_text()
          if 'nexus:crawl-candidate' not in s:
              old = '''              {venue.maps_url && (
                <a
                  href={venue.maps_url}
                  target="_blank"
                  rel="noopener noreferrer"
                  onClick={(e) => e.stopPropagation()}
                  className="flex items-center gap-1 px-2 py-1 rounded-md border border-border/40 text-[11px] text-muted-foreground hover:text-foreground hover:border-border transition-all"
                  aria-label={`Open ${venue.name} in Google Maps`}
                >
                  <ExternalLink className="w-3 h-3" aria-hidden="true" />
                  Maps
                </a>
              )}
'''
              add = '''              {venue.lat != null && venue.lng != null && (
                <button
                  type="button"
                  onClick={(e) => {
                    e.stopPropagation()
                    window.dispatchEvent(new CustomEvent('nexus:crawl-candidate', { detail: venue }))
                  }}
                  className="flex items-center gap-1 px-2 py-1 rounded-md border border-primary/25 bg-primary/[0.05] text-[11px] text-primary hover:bg-primary/10 transition-all"
                  aria-label={`Add ${venue.name} to pub crawl`}
                >
                  <span aria-hidden="true">＋</span>
                  Crawl
                </button>
              )}
'''
              if old not in s: raise SystemExit('Nearby Fits Maps action not found')
              p.write_text(s.replace(old, old + add, 1))
          PY
      - name: Install and validate
        run: |
          cd nexus-premium-ui
          corepack enable
          pnpm install --no-frozen-lockfile
          pnpm exec tsc --noEmit
          pnpm run build
      - name: Commit validated source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nexus-premium-ui/components/nexus/venue-recommendations.tsx
          git diff --cached --quiet || git commit -m 'feat: add Nearby Fits crawl action'
          git push

name: Fix and verify crawl source
on:
  push:
    branches: [feature/group-crawl-integration]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor == 'jr4547279-max'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove patch encoding artefacts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('nexus-premium-ui/components/nexus/pub-crawl-plan-v2.tsx')
          s = p.read_text()
          s = s.replace('\\n', '\n')
          p.write_text(s)
          PY
      - name: Install and validate
        run: |
          cd nexus-premium-ui
          corepack enable
          pnpm install --no-frozen-lockfile
          pnpm exec tsc --noEmit
          pnpm run build
      - name: Commit validated source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nexus-premium-ui/components/nexus/pub-crawl-plan-v2.tsx
          git diff --cached --quiet || git commit -m 'fix: clean crawl integration source formatting'
          git push
